name: Keep Render service awake

# Render's free tier spins a service down after ~15 minutes of no traffic,
# and the first request that wakes it back up can briefly hit a 502 (seen
# as "X-Render-Routing: no-deploy") in the window before the new instance
# finishes registering. Pinging a cheap endpoint well inside that 15-minute
# window keeps the service warm so real users never hit that window at all.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/config
        run: |
          curl -sS -o /dev/null -w "status: %{http_code}\n" --max-time 30 \
            https://universal-video-0rf0.onrender.com/api/config
